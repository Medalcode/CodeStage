name: CI Pipeline

on:
  push:
    branches: [ main, master, "feature/*" ]
  pull_request:
    branches: [ main, master, "feature/*" ]

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'remotion-app/package-lock.json'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install Remotion NPM Dependencies
        run: |
          cd remotion-app
          npm ci || npm install

      - name: Syntax & Compilation Check
        run: |
          python -m py_compile server.py services/renderer.py generator/script_generator.py database.py utils.py compositor.py automator.py unir_videos.py

      - name: Run Test Suite
        run: |
          pytest -v --tb=short
