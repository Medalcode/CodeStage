[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canal-tutorial-automation"
version = "1.0.0"
description = "Sistema automatizado para generar videos de YouTube con avatar parlante animado."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Medalcode"}
]
dependencies = [
    "moviepy>=2.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "edge-tts>=6.1.0",
]

[project.urls]
Homepage = "https://github.com/Medalcode/canal-tutorial-automation"
