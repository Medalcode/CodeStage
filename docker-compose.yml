version: '3.8'

services:
  studio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-video-studio-app
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/remotion-app/node_modules
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: python server.py
